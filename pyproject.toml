[project]
name = "arc-bench-backend"
version = "0.1.0"
description = "ARC-Bench API and Docker executor"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "gunicorn>=23,<24",
    "sqlalchemy==2.0.41",
    "alembic>=1.15,<2",
    "psycopg[binary]>=3.2,<4",
    "celery[redis]>=5.4,<6",
    "pydantic-settings==2.9.1",
    "python-multipart==0.0.20",
    "docker==7.1.0",
    "email-validator==2.2.0",
    "PyYAML==6.0.2",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "PyJWT[crypto]>=2.10,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.scripts]
arcbench-api = "app.api_server:main"
arcbench-dispatcher = "app.worker.dispatcher:main"
arcbench-executor = "app.executor:main"
arcbench-recovery = "app.worker.recovery:main"
arcbench-previewer = "app.previewer:main"
arcbench-migrate = "app.db.migrate:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
